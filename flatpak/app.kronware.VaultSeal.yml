app-id: app.kronware.VaultSeal
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: app.kronware.VaultSeal
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: vaultseal
    buildsystem: simple
    build-commands:
      - install -Dm755 app.kronware.VaultSeal /app/bin/app.kronware.VaultSeal
      - install -Dm644 VaultSeal.jar /app/share/vaultseal/VaultSeal.jar
      - install -Dm644 app.kronware.VaultSeal.desktop /app/share/applications/app.kronware.VaultSeal.desktop
      - install -Dm644 app.kronware.VaultSeal.metainfo.xml /app/share/metainfo/app.kronware.VaultSeal.metainfo.xml
      - install -Dm644 app.kronware.VaultSeal.png /app/share/icons/hicolor/128x128/apps/app.kronware.VaultSeal.png
      - install -d /app/lib/vaultseal/runtime
      - tar -xzf OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1.tar.gz --strip-components=1 -C /app/lib/vaultseal/runtime
    sources:
      - type: file
        url: https://media.githubusercontent.com/media/Kronware/VaultSeal-Releases/5c663e987836b22bd012076b186614e4b348804e/vaultseal-desktop.jar
        sha256: 008153d18cc0a9b18a752b44ac82783242078f358ffe0966a99428a3f6b2583c
        dest-filename: VaultSeal.jar
      - type: file
        url: https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20.1%2B1/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1.tar.gz
        sha256: 0b2b640e3046b64c8ec504de0ab9d91bb5610182bda21fad454681ce54d45a62
        dest-filename: OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1.tar.gz
      - type: file
        path: app.kronware.VaultSeal
      - type: file
        path: app.kronware.VaultSeal.desktop
      - type: file
        path: app.kronware.VaultSeal.metainfo.xml
      - type: file
        path: app.kronware.VaultSeal.png
